name: Generate Labo Lists

on:
  push:
    branches: ['**']

jobs:
  generate:
    # Skip commits that the workflow itself already produced to avoid loops.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Generate labo assignment lists
        run: node scripts/generate-labo-lists.js

      - name: Commit updated labo lists (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet && git diff --staged --quiet || (
            git add -A
            git commit -m "Auto-generate labo lists [skip ci]"
            git push
          )
